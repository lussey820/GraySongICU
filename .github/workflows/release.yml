name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 准备内嵌 ffmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP 'ffmpeg') -Force
          $exe = Get-ChildItem -Path (Join-Path $env:TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path '..\bin' | Out-Null
          Copy-Item $exe.FullName -Destination '..\bin\ffmpeg.exe' -Force

      - name: 打包安装包 / 绿色版 / 便携版
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win dir zip nsis portable --publish never

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/GraySongICU-Setup.exe
            electron/dist/GraySongICU-Portable.exe
            electron/dist/*.zip
          generate_release_notes: true
